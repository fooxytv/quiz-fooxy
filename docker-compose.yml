services:
  quiz:
    build:
      context: .
      args:
        BUILD_SHA: "${BUILD_SHA:-unknown}"
        BUILD_AT: "${BUILD_AT:-unknown}"
    image: marvel-quiz:latest
    container_name: marvel-quiz
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /data
    volumes:
      - quiz-data:/data
    # No ports published: the tunnel reaches it over the compose network.
    expose:
      - "3000"

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: marvel-quiz-tunnel
    restart: unless-stopped
    # The token goes in the environment, not the command line: a command-line
    # token is visible to anyone who can run `docker ps` or read /proc.
    # `:?` makes compose refuse to start rather than launching a tokenless tunnel.
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: "${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env - see .env.example}"
    depends_on:
      quiz:
        condition: service_healthy

volumes:
  quiz-data:
