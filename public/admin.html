<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Marvel Wordle — Host</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800&family=Chivo:ital,wght@0,400;0,700;0,900;1,400&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <div class="inner">
    <div class="wordmark"><span class="a">MARVEL</span><span class="b">Wordle</span></div>
    <span class="hostbadge">Host</span>
    <span class="pill" id="statusPill"><span class="dot"></span><span id="statusText">Connecting</span></span>
    <span class="spacer"></span>
  </div>
</header>
<main>
  <div class="seg" role="group" aria-label="Host view">
    <button id="tabLobby" aria-pressed="true">Join screen</button>
    <button id="tabBoard" aria-pressed="false">Leaderboard</button>
    <button id="tabWords" aria-pressed="false">Words</button>
  </div>
  <section id="view"></section>
</main>
<script src="/admin.js"></script>
</body>
</html>
